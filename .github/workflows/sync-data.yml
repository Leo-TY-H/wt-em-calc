name: Sync game data

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'references/**'
      - 'requirements*.txt'
      - '.github/workflows/sync-data.yml'
      - '.gitattributes'

permissions:
  contents: read

concurrency:
  group: game-data-main
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: 'requirements*.txt'
      - run: python -m pip install -r requirements-plotter.txt
      - run: python scripts/bootstrap_runtime.py
      - run: python scripts/repository_policy.py
      - run: python -m unittest discover -s tests -v
      - name: Download and verify latest aircraft data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/sync_game_data.py --force
      - name: Refresh website catalog
        run: python scripts/update_pages_snapshot.py --offline
      - run: python scripts/build_em_backend.py
      - run: python scripts/verify_portable_runtime.py
